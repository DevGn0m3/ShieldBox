name: "CodeQL Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      # Actualizado a v4 para evitar la obsolescencia de diciembre de 2026
      uses: github/codeql-action/init@v4 
      with:
        languages: 'csharp'
        build-mode: none 
        tools: linked 

    - name: Perform CodeQL Analysis
      # Actualizado a v4 para coincidir con el paso de inicialización
      uses: github/codeql-action/analyze@v4
